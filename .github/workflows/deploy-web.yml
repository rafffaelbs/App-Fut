name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release -t lib/main_web.dart

      - name: Generate Cloudflare redirects
        env:
          FUT_TOKEN: ${{ secrets.FUT_TOKEN }}
        run: |
          printf "/fut /#/g/%s 302\n" "$FUT_TOKEN" > build/web/_redirects

      - name: Ensure Cloudflare headers and robots
        run: |
          cp web/robots.txt build/web/robots.txt
          cp web/_headers build/web/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=app-fut-site --branch=main
